name: Compilar APK (Android)

on:
  push:
    branches: [main, master]
  workflow_dispatch: # también se puede lanzar a mano desde la pestaña Actions

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias web
        run: npm ci

      - name: Compilar la web y sincronizar con Android
        run: npx vite build && npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de prueba (debug)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
